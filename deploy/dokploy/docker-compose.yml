# OpenMausBot on Dokploy, built from this fork's source.
#
# Dokploy's Traefik terminates HTTPS for your domain and forwards to Caddy on
# port 80 of the `omb` service. Caddy shares omb's network namespace and
# reaches the server on 127.0.0.1, so the server never binds a public
# interface. Login is pairing (docs/self-hosting.md).
#
# In Dokploy: Compose service, source = this repo, compose path =
# ./deploy/dokploy/docker-compose.yml, domain -> service `omb`, port 80.
# Set DOMAIN (and optionally ENGINES) in the Environment tab.
services:
  omb:
    build:
      context: ../..
      target: server
      args:
        ENGINES: ${ENGINES:-@anthropic-ai/claude-code}
    restart: unless-stopped
    init: true
    shm_size: 512m
    volumes:
      - omb_data:/data
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      OMB_PUBLIC_URL: https://${DOMAIN}
      OMB_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      OMB_SIGNIN_EMAILS: ${OMB_SIGNIN_EMAILS:-}
    networks:
      - dokploy-network
    # Dokploy also attaches the project's default network, which Traefik is not
    # on; without this Traefik may route to that address and answer 502.
    labels:
      - traefik.docker.network=dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    network_mode: "service:omb"
    depends_on:
      omb:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  dokploy-network:
    external: true

volumes:
  omb_data:
  caddy_data:
  caddy_config:
